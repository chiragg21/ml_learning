[project]
name = "ml-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "albumentationsx>=2.4.2",
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
]

[project.scripts]
ml-learning = "ml_learning:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
